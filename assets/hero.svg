<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Felipe Cosse — Data Engineering, AI Systems, Cloud Platforms</title>
  <desc id="desc">A dark editorial banner with a luminous data constellation and Felipe Cosse's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111b"/>
      <stop offset="0.58" stop-color="#0b1924"/>
      <stop offset="1" stop-color="#102532"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="45%" r="42%">
      <stop offset="0" stop-color="#b7ef63" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#4fd1c5" stop-opacity=".06"/>
      <stop offset="1" stop-color="#07111b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d8e8e5" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>
    <rect x="704" width="496" height="420" fill="url(#grid)"/>

    <path d="M-50 373 C190 296 285 454 535 353 S920 293 1270 345" fill="none" stroke="#f28c5b" stroke-opacity=".18" stroke-width="1.5"/>
    <path d="M-40 385 C230 325 302 470 548 370 S930 315 1270 360" fill="none" stroke="#b7ef63" stroke-opacity=".12" stroke-width="1"/>

    <g transform="translate(72 58)">
      <rect width="193" height="32" rx="16" fill="#b7ef63"/>
      <circle cx="17" cy="16" r="4" fill="#07111b"/>
      <text x="31" y="21" fill="#07111b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.8">BUILDING IN PUBLIC</text>
    </g>

    <text x="70" y="190" fill="#f4ead7" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" letter-spacing="-2">Felipe Cosse</text>
    <text x="73" y="234" fill="#a9bbb9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2.6">DATA ENGINEERING  /  AI SYSTEMS  /  CLOUD PLATFORMS</text>
    <line x1="73" y1="269" x2="118" y2="269" stroke="#f28c5b" stroke-width="4"/>
    <text x="73" y="312" fill="#d5dfdb" font-family="Georgia, 'Times New Roman', serif" font-size="20">
      Turning complex systems into clear, useful products.
    </text>
    <text x="73" y="345" fill="#718784" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1">SAN FRANCISCO BAY AREA  •  GITHUB.COM/FELIPE-COSSE</text>

    <g transform="translate(720 50)">
      <circle cx="208" cy="158" r="142" fill="none" stroke="#d7e5e0" stroke-opacity=".09"/>
      <circle cx="208" cy="158" r="110" fill="none" stroke="#d7e5e0" stroke-opacity=".12" stroke-dasharray="4 10"/>
      <circle cx="208" cy="158" r="75" fill="#07111b" fill-opacity=".72" stroke="#b7ef63" stroke-opacity=".5"/>
      <text x="208" y="178" text-anchor="middle" fill="#f4ead7" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">FC</text>

      <g fill="none" stroke="#6dd6cb" stroke-opacity=".5" stroke-width="1.5">
        <path d="M73 106 L140 55 L208 83 L282 42 L349 101"/>
        <path d="M69 226 L137 190 L208 232 L288 192 L354 226"/>
      </g>

      <g filter="url(#softGlow)">
        <circle cx="73" cy="106" r="5" fill="#f28c5b"/>
        <circle cx="140" cy="55" r="5" fill="#b7ef63"/>
        <circle cx="208" cy="83" r="5" fill="#6dd6cb"/>
        <circle cx="282" cy="42" r="5" fill="#f28c5b"/>
        <circle cx="349" cy="101" r="5" fill="#b7ef63"/>
        <circle cx="69" cy="226" r="5" fill="#6dd6cb"/>
        <circle cx="137" cy="190" r="5" fill="#f28c5b"/>
        <circle cx="208" cy="232" r="5" fill="#b7ef63"/>
        <circle cx="288" cy="192" r="5" fill="#6dd6cb"/>
        <circle cx="354" cy="226" r="5" fill="#f28c5b"/>
      </g>

      <g fill="#8ca19e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">
        <text x="50" y="91">INGEST</text>
        <text x="313" y="88">SERVE</text>
        <text x="44" y="252">MODEL</text>
        <text x="319" y="252">LEARN</text>
      </g>
    </g>

    <rect x=".75" y=".75" width="1198.5" height="418.5" rx="23.25" fill="none" stroke="#dae8e4" stroke-opacity=".14" stroke-width="1.5"/>
  </g>
</svg>